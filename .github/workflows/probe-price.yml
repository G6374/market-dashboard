name: 京东价格端点云端探测（临时）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 实测各价格端点
        run: python _probe_cloud.py
      - name: 提交探测结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe_result.json
          git commit -m "price endpoint probe result" || echo "no change"
          git push
