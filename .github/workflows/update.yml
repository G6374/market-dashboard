name: 市场动态看板每日更新
on:
  schedule:
    - cron: "0 15 * * *"      # UTC 15:00 = 北京时间 23:00
  workflow_dispatch:          # 支持手动触发测试
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install --quiet requests feedparser beautifulsoup4 lxml tzdata
      - name: 生成看板数据（抓取官方源 + 调用 LLM 写小结）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}
          FALLBACK_API_URL: ${{ secrets.FALLBACK_API_URL }}
          FALLBACK_MODEL: ${{ secrets.FALLBACK_MODEL }}
        run: python generate.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "每日自动更新 $(date +%F)"
            git push
          fi
