<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>市场动态看板</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7; font-size:15px;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:28px 20px 60px;}
  header.top{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:6px;}
  h1{font-size:24px; margin:0; letter-spacing:.5px;}
  .sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .proto-badge{
    display:inline-block; background:#fff7ed; color:#c2410c; border:1px solid #fed7aa;
    padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600;
  }
  .toolbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; margin:18px 0 22px; box-shadow:var(--shadow);
  }
  .toolbar label{font-size:13px; color:var(--muted);}
  select{
    font:inherit; padding:7px 12px; border:1px solid var(--line); border-radius:8px;
    background:#fff; color:var(--ink); cursor:pointer;
  }
  .updated{margin-left:auto; font-size:13px; color:var(--muted);}
  .updated b{color:var(--ink);}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
  @media (max-width:860px){ .grid{grid-template-columns:1fr;} }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
  }
  .card-head{
    display:flex; align-items:center; gap:10px; padding:16px 18px;
    border-bottom:1px solid var(--line); border-left:4px solid var(--accent,#2563eb);
  }
  .dot{width:10px; height:10px; border-radius:50%; background:var(--accent,#2563eb);}
  .card-head h2{font-size:17px; margin:0; flex:1;}
  .tag{font-size:11px; color:#9ca3af; border:1px solid var(--line); border-radius:6px; padding:2px 7px;}
  .card-body{padding:16px 18px 18px;}
  .summary{
    background:#f8fafc; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:14px; color:#374151; margin-bottom:14px;
  }
  .summary .lbl{font-weight:600; color:var(--ink); display:block; margin-bottom:4px; font-size:12px; letter-spacing:.5px;}
  .group-title{
    font-size:12px; font-weight:700; color:var(--muted); letter-spacing:1px;
    margin:14px 0 8px; text-transform:uppercase;
  }
  .item{
    border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:10px;
    transition:border-color .15s, box-shadow .15s; background:#fff;
  }
  .item:hover{border-color:var(--accent,#2563eb); box-shadow:0 2px 10px rgba(16,24,40,.07);}
  .item .ititle{font-size:14px; font-weight:600; color:var(--ink); margin:0 0 4px;}
  .item .iexcerpt{font-size:13px; color:#4b5563; margin:0 0 8px;}
  .item .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .src{
    font-size:11px; background:#eef2ff; color:#3730a3; border-radius:6px; padding:2px 8px; font-weight:600;
  }
  .vendor{font-size:11px; background:#ecfeff; color:#0e7490; border-radius:6px; padding:2px 8px; font-weight:600;}
  .link{
    margin-left:auto; font-size:12px; color:#2563eb; text-decoration:none; font-weight:600;
    display:inline-flex; align-items:center; gap:3px;
  }
  .link:hover{text-decoration:underline;}
  .empty{color:var(--muted); font-size:13px; padding:8px 2px;}
  /* 周/月总结面板 */
  .review-wrap{margin-top:22px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px;}
  .review-head{display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:14px;}
  .review-head h2{font-size:17px; margin:0; flex:1;}
  .review-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:860px){ .review-grid{grid-template-columns:1fr;} }
  .review-card{border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:#f8fafc;}
  .rc-head{font-size:15px; font-weight:700; color:var(--ink);}
  .rc-period{font-size:12px; color:var(--muted); margin:4px 0 8px;}
  .rc-body{font-size:14px; color:#374151;}
  /* term annotation */
  .term{
    border-bottom:1px dotted #2563eb; cursor:help; position:relative; color:#1e3a8a;
  }
  .term:hover::after{
    content:attr(data-tip); position:absolute; left:0; top:130%; width:270px;
    background:#111827; color:#fff; padding:9px 11px; border-radius:8px; font-size:12px;
    line-height:1.6; z-index:60; white-space:normal; box-shadow:0 6px 18px rgba(0,0,0,.25);
    font-weight:400; letter-spacing:0;
  }
  .term:hover::before{
    content:''; position:absolute; left:12px; top:118%; border:6px solid transparent;
    border-bottom-color:#111827; z-index:61;
  }
  .gloss-btn{
    position:fixed; right:22px; bottom:22px; background:#111827; color:#fff; border:none;
    padding:12px 16px; border-radius:999px; font-size:13px; cursor:pointer; box-shadow:var(--shadow);
  }
  .gloss-btn:hover{background:#1f2937;}
  .modal{position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:80;}
  .modal.open{display:flex;}
  .modal-box{background:#fff; border-radius:14px; max-width:680px; width:100%; max-height:80vh; overflow:auto; padding:22px 24px;}
  .modal-box h3{margin:0 0 14px; font-size:18px;}
  .gl-item{border-bottom:1px solid var(--line); padding:10px 0;}
  .gl-item .gt{font-weight:700; color:#1e3a8a;}
  .gl-item .gd{color:#4b5563; font-size:13px; margin-top:2px;}
  .close{float:right; cursor:pointer; color:var(--muted); font-size:20px; line-height:1; border:none; background:none;}
  footer{margin-top:30px; color:var(--muted); font-size:12px; text-align:center;}
  .exp-btn{font:inherit; padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#2563eb; cursor:pointer; font-weight:600; margin-left:8px;}
  .exp-btn:hover{background:#eff6ff;}
  @media print{
    .toolbar,.gloss-btn,.modal{display:none !important;}
    body{background:#fff;}
    .card,.review-wrap{box-shadow:none; border-color:#d1d5db;}
    .wrap{padding:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="boardTitle">市场动态看板</h1>
      <div class="sub">市场每日动态 · 权威官方来源</div>
    </div>
    <span class="proto-badge" id="protoBadge">设计原型 · 示例数据</span>
  </header>

  <div class="toolbar">
    <label for="dateSel">更新日期</label>
    <select id="dateSel"></select>
    <div class="updated">数据更新于：<b id="updatedAt">—</b></div>
    <button id="btnHtml" class="exp-btn">导出 HTML</button>
    <button id="btnPdf" class="exp-btn">导出 PDF</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="review-wrap" id="reviewPanel"></div>

  <footer id="footer"></footer>
</div>

<button class="gloss-btn" id="glossBtn">术语表 / 名词解释</button>

<div class="modal" id="glossModal">
  <div class="modal-box">
    <button class="close" id="glossClose">&times;</button>
    <h3>术语表（点击看板中带下划线的词也可查看）</h3>
    <div id="glossList"></div>
  </div>
</div>

<script>
  // 读取内嵌数据（自动化将改写 MARKET-DATA 区块）
  function getSeed(){
    try{
      const el = document.getElementById('market-data');
      return JSON.parse(el.textContent);
    }catch(e){ return null; }
  }

  const DATA = getSeed();
  const GLOSSARY = (DATA && DATA.glossary) || {};

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // 名词注释：把文本中的术语替换为带提示的样式（同一页面内仅首次出现才加注释）
  let annotatedCache = new Set();
  function annotate(text){
    const terms = Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
    if(!terms.length) return escapeHtml(text);
    const esc = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const parts = esc.map((t,i)=>{
      const orig = terms[i];
      if(/^[A-Za-z0-9 ./\-()]+$/.test(orig)) return '\\b'+t+'\\b';
      return t;
    });
    const re = new RegExp('('+parts.join('|')+')','gi');
    const termMap = {};
    terms.forEach(t => termMap[t.toLowerCase()] = GLOSSARY[t]);
    const escaped = escapeHtml(text);
    let out='', last=0, m;
    while((m = re.exec(escaped)) !== null){
      const key = m[1];
      const low = key.toLowerCase();
      out += escaped.slice(last, m.index);
      if(annotatedCache.has(low)){
        out += key;                       // 已注释过，本次原样输出
      } else {
        annotatedCache.add(low);
        const tip = termMap[low] || '';
        out += '<span class="term" data-tip="'+escapeAttr(tip)+'">'+key+'</span>';
      }
      last = m.index + key.length;
      if(m.index === re.lastIndex) re.lastIndex++;
    }
    out += escaped.slice(last);
    return out;
  }

  // 收集所有出现过的日期（并集），用于日期选择（不含总结模块）
  function allDates(){
    const set = new Set();
    (DATA.sections||[]).forEach(s=>{
      if(s.type==='review') return;
      Object.keys(s.dates||{}).forEach(d=>set.add(d));
    });
    return Array.from(set).sort().reverse();
  }

  function render(){
    document.getElementById('boardTitle').textContent = DATA.meta.title || '分销市场动态看板';
    document.getElementById('updatedAt').textContent = DATA.meta.updatedAt || '—';
    const proto = document.getElementById('protoBadge');
    if(DATA.meta.isPrototype){ proto.style.display='inline-block'; proto.textContent='设计原型 · 示例数据'; }
    else { proto.style.display='none'; }

    const dates = allDates();
    const sel = document.getElementById('dateSel');
    sel.innerHTML = dates.map(d=>'<option value="'+d+'">'+d+'</option>').join('') || '<option>暂无数据</option>';

    document.getElementById('footer').textContent =
      (DATA.meta.isPrototype ? DATA.meta.prototypeNote + ' · ' : '') +
      '本看板所有动态均可点击“查看来源”跳转至官方权威网站。每日北京时间 24:00 更新（仅收录当日发布的资讯）；周总结每周日 24:00 生成，月总结每月最后一天 24:00 生成；历史保留 30 天。';

    sel.onchange = ()=>renderGrid(sel.value);
    renderGrid(dates[0]);
    annotatedCache = new Set();   // 总结模块独立计"首次出现"
    renderReview();
    renderGlossary();
  }

  function renderGrid(date){
    annotatedCache = new Set();   // 切换日期时重置：本页内术语仅首次出现加注释
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    (DATA.sections||[]).filter(s=>s.type!=='review').forEach(sec=>{
      const entry = (sec.dates||{})[date];
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--accent', sec.accent || '#2563eb');

      let body = '';
      if(!entry){
        body = '<div class="empty">该日期暂无数据。</div>';
      } else {
        body += '<div class="summary"><span class="lbl">每日小结</span>'+annotate(entry.summary||'')+'</div>';
        const items = entry.items || [];

        if(sec.id === 'compute'){
          const foreign = items.filter(i=>i.region==='foreign');
          const domestic = items.filter(i=>i.region==='domestic');
          body += groupHtml('国外厂商', foreign);
          body += groupHtml('国内厂商', domestic);
        } else {
          body += itemsHtml(items);
        }
      }

      card.innerHTML =
        '<div class="card-head"><span class="dot"></span><h2>'+escapeHtml(sec.name)+'</h2>'+
        '<span class="tag">每日动态</span></div>'+
        '<div class="card-body">'+body+'</div>';
      grid.appendChild(card);
    });
  }

  function itemsHtml(items){
    if(!items.length) return '<div class="empty">暂无动态条目。</div>';
    return items.map(it=>{
      const vendor = it.vendor ? '<span class="vendor">'+escapeHtml(it.vendor)+'</span>' : '';
        const excerpt = it.excerpt ? '<p class="iexcerpt">'+annotate(it.excerpt)+'</p>' : '';
      const url = it.url || '';
      const valid = /^https?:\/\//i.test(url);
      const linkHtml = valid
        ? '<a class="link" href="'+escapeAttr(url)+'" target="_blank" rel="noopener">查看来源 ↗</a>'
        : '<span class="link disabled">暂无可用来源链接</span>';
      return '<div class="item">'+
        '<p class="ititle">'+annotate(it.title||'')+'</p>'+
        excerpt+
        '<div class="meta">'+vendor+'<span class="src">'+escapeHtml(it.source||'来源')+'</span>'+
        linkHtml+'</div>'+
        '</div>';
    }).join('');
  }

  function groupHtml(title, items){
    if(!items.length) return '';
    return '<div class="group-title">'+escapeHtml(title)+'</div>'+itemsHtml(items);
  }

  // 周/月总结模块
  function renderReview(){
    const sec = (DATA.sections||[]).find(s=>s.type==='review');
    const panel = document.getElementById('reviewPanel');
    if(!sec){ panel.innerHTML=''; return; }
    const w = sec.weekly||{}, m = sec.monthly||{};
    panel.innerHTML =
      '<div class="review-head"><span class="dot" style="background:'+sec.accent+'"></span>'+
      '<h2>'+escapeHtml(sec.name)+'</h2><span class="tag">自动生成</span></div>'+
      '<div class="review-grid">'+
        reviewCard('周总结', w.period, w.summary)+
        reviewCard('月总结', m.period, m.summary)+
      '</div>';
  }
  function reviewCard(title, period, summary){
    return '<div class="review-card"><div class="rc-head">'+title+'</div>'+
      (period?'<div class="rc-period">'+escapeHtml(period)+'</div>':'')+
      '<div class="rc-body">'+(summary?annotate(summary):'<span class="empty">暂无</span>')+'</div></div>';
  }

  function renderGlossary(){
    const list = document.getElementById('glossList');
    list.innerHTML = Object.keys(GLOSSARY).sort((a,b)=>a.length-b.length).map(k=>
      '<div class="gl-item"><div class="gt">'+escapeHtml(k)+'</div><div class="gd">'+escapeHtml(GLOSSARY[k])+'</div></div>'
    ).join('');
  }

  // 术语表弹窗
  document.getElementById('glossBtn').onclick = ()=> document.getElementById('glossModal').classList.add('open');
  document.getElementById('glossClose').onclick = ()=> document.getElementById('glossModal').classList.remove('open');
  document.getElementById('glossModal').onclick = (e)=>{ if(e.target.id==='glossModal') e.target.classList.remove('open'); };

  // 导出功能
  document.getElementById('btnHtml').onclick = exportHTML;
  document.getElementById('btnPdf').onclick = ()=>window.print();
  function exportHTML(){
    const clone = document.querySelector('.wrap').cloneNode(true);
    const tb = clone.querySelector('.toolbar'); if(tb) tb.remove();
    const gb = clone.querySelector('.gloss-btn'); if(gb) gb.remove();
    const css = Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
    const doc = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>'+escapeHtml(DATA.meta.title)+'</title><style>'+css+'</style></head><body>'+clone.outerHTML+'</body></html>';
    const blob = new Blob([doc], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (DATA.meta.title||'市场动态看板')+'_'+(DATA.meta.updatedAt||'')+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }

  render();
</script>
</body>
</html>
