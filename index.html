<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>市场动态看板</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#ffffff; --ink:#111827; --muted:#64748b;
    --line:#e6e9f0; --accent:#2563eb;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.14);
    --shadow-lg:0 2px 4px rgba(15,23,42,.05),0 18px 44px -16px rgba(15,23,42,.2);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.75; font-size:15px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    background:
      radial-gradient(1100px 480px at 12% -8%, rgba(37,99,235,.08), transparent 60%),
      radial-gradient(900px 420px at 92% -12%, rgba(234,88,12,.06), transparent 55%),
      linear-gradient(180deg,#f7f9fc,#f1f4f9);
    background-attachment:fixed;
  }
  ::selection{background:rgba(37,99,235,.18);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1; border-radius:999px; border:2px solid #f1f4f9;}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8;}
  .wrap{max-width:1180px; margin:0 auto; padding:36px 24px 64px;}

  /* ───── 页头 ───── */
  header.top{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:10px;}
  h1{
    font-size:27px; font-weight:800; margin:0; letter-spacing:.5px; line-height:1.35;
    background:linear-gradient(92deg,#0f172a 30%,#1d4ed8 110%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub{color:var(--muted); font-size:13px; margin-top:6px; letter-spacing:.3px; display:flex; align-items:center; gap:8px;}
  .sub::before{content:''; width:18px; height:2px; border-radius:2px; background:linear-gradient(90deg,#2563eb,#ea580c);}
  .proto-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:#fff7ed; color:#c2410c; border:1px solid #fed7aa;
    padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600;
    box-shadow:var(--shadow-sm);
  }
  .proto-badge::before{content:''; width:6px; height:6px; border-radius:50%; background:#f97316;}

  /* ───── 工具栏（毛玻璃吸顶） ───── */
  .toolbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:rgba(255,255,255,.86); border:1px solid rgba(230,233,240,.9);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border-radius:14px; padding:12px 18px; margin:22px 0 26px;
    box-shadow:var(--shadow); position:sticky; top:12px; z-index:50;
  }
  .toolbar label{font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.5px;}
  select{
    font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:10px;
    background:#fff; color:var(--ink); cursor:pointer; font-weight:600;
    box-shadow:var(--shadow-sm); transition:border-color .2s, box-shadow .2s;
  }
  select:hover{border-color:#c7d2fe;}
  select:focus-visible{outline:2px solid #2563eb; outline-offset:2px;}
  .updated{margin-left:auto; font-size:13px; color:var(--muted);}
  .updated b{
    color:var(--ink); font-variant-numeric:tabular-nums;
    background:#f1f5f9; border:1px solid var(--line); border-radius:8px; padding:2px 9px; margin-left:2px;
  }
  .exp-btn{
    font:inherit; font-size:13px; padding:8px 14px; border:1px solid #dbe3ef; border-radius:10px;
    background:#fff; color:#1d4ed8; cursor:pointer; font-weight:600; margin-left:2px;
    transition:all .2s;
  }
  .exp-btn:hover{background:#1d4ed8; border-color:#1d4ed8; color:#fff; box-shadow:0 4px 14px -4px rgba(29,78,216,.5);}
  .exp-btn:focus-visible{outline:2px solid #2563eb; outline-offset:2px;}

  /* ───── 卡片网格 ───── */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:22px;}
  @media (max-width:860px){ .grid{grid-template-columns:1fr;} }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
    transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
    animation:rise .55s cubic-bezier(.2,.7,.3,1) both;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg);}
  .card:nth-child(1){animation-delay:.02s} .card:nth-child(2){animation-delay:.1s}
  .card:nth-child(3){animation-delay:.18s} .card:nth-child(4){animation-delay:.26s}
  .card:nth-child(5){animation-delay:.34s} .card:nth-child(6){animation-delay:.42s}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  .card-head{
    display:flex; align-items:center; gap:11px; padding:16px 20px;
    border-bottom:1px solid var(--line);
    border-top:3px solid var(--accent,#2563eb);
    background:linear-gradient(135deg, color-mix(in srgb,var(--accent,#2563eb) 7%,#fff), #fff 70%);
  }
  .dot{
    width:10px; height:10px; border-radius:50%; flex:none;
    background:var(--accent,#2563eb);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent,#2563eb) 16%, transparent);
  }
  .card-head h2{font-size:17px; font-weight:700; margin:0; flex:1; letter-spacing:.3px;}
  .tag{
    font-size:11px; font-weight:700; color:var(--muted);
    background:#f1f5f9; border:1px solid var(--line); border-radius:999px;
    padding:3px 10px; letter-spacing:1px;
  }
  .card-body{padding:18px 20px 20px;}

  /* ───── 每日小结 ───── */
  .summary{
    background:linear-gradient(135deg, color-mix(in srgb,var(--accent,#2563eb) 6%,#fff), #fff 80%);
    background-color:#f8fafc; border:1px solid var(--line);
    border-left:3px solid var(--accent,#2563eb); border-radius:12px;
    padding:13px 16px; font-size:14px; color:#374151; margin-bottom:16px;
  }
  .summary .lbl{
    font-weight:700; color:var(--accent,#2563eb); display:inline-block; margin-right:8px;
    font-size:12px; letter-spacing:1.5px;
  }

  /* ───── 分组标题（国外/国内） ───── */
  .group-title{
    display:flex; align-items:center; gap:9px;
    font-size:12px; font-weight:800; color:#475569; letter-spacing:1.5px;
    margin:16px 0 10px;
  }
  .group-title::before{content:''; width:4px; height:13px; border-radius:2px; background:var(--accent,#2563eb); flex:none;}
  .group-title::after{content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent);}

  /* ───── 资讯条目 ───── */
  .item{
    background:#fbfcfe; border:1px solid var(--line); border-radius:12px;
    padding:12px 15px; margin-bottom:10px; position:relative; overflow:hidden;
    transition:background .2s, border-color .2s, box-shadow .2s;
  }
  .item::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent,#2563eb); opacity:0; transition:opacity .2s;
  }
  .item:hover{
    background:#fff; border-color:color-mix(in srgb,var(--accent,#2563eb) 32%, var(--line));
    box-shadow:0 6px 18px -8px rgba(15,23,42,.14);
  }
  .item:hover::before{opacity:1;}
  .item .ititle{font-size:14px; font-weight:700; color:var(--ink); margin:0 0 4px; line-height:1.6;}
  .item .iexcerpt{font-size:13px; color:#4b5563; margin:0 0 9px;}
  .item .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .src{
    font-size:11px; background:#f1f5f9; color:#475569; border:1px solid var(--line);
    border-radius:999px; padding:2px 9px; font-weight:600;
  }
  .vendor{
    font-size:11px; background:color-mix(in srgb,var(--accent,#2563eb) 9%,#fff); background-color:#ecfdf5;
    color:color-mix(in srgb,var(--accent,#2563eb) 75%, #111827); color:#0f766e;
    border:1px solid color-mix(in srgb,var(--accent,#2563eb) 24%, transparent); border-color:#99f6e4;
    border-radius:999px; padding:2px 9px; font-weight:700;
  }
  .link{
    margin-left:auto; font-size:12px; font-weight:600; text-decoration:none;
    color:#1d4ed8; background:#fff; border:1px solid #dbe3ef;
    border-radius:999px; padding:4px 12px;
    display:inline-flex; align-items:center; gap:4px; transition:all .2s;
  }
  .link:hover{background:#1d4ed8; border-color:#1d4ed8; color:#fff; box-shadow:0 4px 12px -4px rgba(29,78,216,.45);}
  .link.disabled{color:#94a3b8; border-color:var(--line); background:#f8fafc; cursor:default;}
  .link.disabled:hover{background:#f8fafc; color:#94a3b8; box-shadow:none;}
  .empty{color:var(--muted); font-size:13px; padding:6px 2px;}

  /* ───── 官方关注渠道 ───── */
  .channels{
    margin-top:10px; padding:12px 14px;
    background:color-mix(in srgb,var(--accent,#2563eb) 4%,#fff); background-color:#f8fafc;
    border:1px solid color-mix(in srgb,var(--accent,#2563eb) 16%, #fff); border-color:var(--line);
    border-radius:12px;
  }
  .channels .ch-lbl{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px; letter-spacing:.5px;}
  .channels .ch-link{
    display:inline-block; margin:0 8px 6px 0; text-decoration:none; font-size:12.5px; font-weight:600;
    color:#1d4ed8; background:#fff; border:1px solid #dbe3ef; border-radius:999px; padding:4px 12px;
    transition:all .2s;
  }
  .channels .ch-link:hover{background:#1d4ed8; border-color:#1d4ed8; color:#fff;}

  /* ───── 周/月总结 ───── */
  .review-wrap{
    margin-top:26px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
  }
  .review-head{
    display:flex; align-items:center; gap:11px; padding:17px 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(135deg, color-mix(in srgb,#475569 7%,#fff), #fff 70%);
  }
  .review-head h2{font-size:17px; margin:0; flex:1; letter-spacing:.3px;}
  .review-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:20px 22px 22px;}
  @media (max-width:860px){ .review-grid{grid-template-columns:1fr;} }
  .review-card{
    border:1px solid var(--line); border-radius:12px; padding:16px 18px;
    background:linear-gradient(180deg,#fafbfd,#fff); box-shadow:var(--shadow-sm);
    transition:box-shadow .2s, border-color .2s;
  }
  .review-card:hover{border-color:#cbd5e1; box-shadow:0 6px 18px -8px rgba(15,23,42,.12);}
  .rc-head{font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .rc-head::before{content:'❝'; color:#94a3b8; font-size:18px; line-height:1;}
  .rc-period{
    font-size:12px; color:var(--muted); margin:6px 0 10px; display:inline-block;
    background:#f1f5f9; border:1px solid var(--line); border-radius:999px; padding:2px 10px;
    font-variant-numeric:tabular-nums;
  }
  .rc-body{font-size:14px; color:#374151;}

  /* ───── 术语注释 & 弹窗 ───── */
  .term{border-bottom:1px dotted #2563eb; cursor:help; position:relative; color:#1e3a8a;}
  .term:hover::after{
    content:attr(data-tip); position:absolute; left:0; top:130%; width:280px;
    background:#0f172a; color:#fff; padding:10px 12px; border-radius:10px; font-size:12px;
    line-height:1.65; z-index:60; white-space:normal; box-shadow:0 12px 28px rgba(0,0,0,.3);
    font-weight:400; letter-spacing:0;
  }
  .term:hover::before{
    content:''; position:absolute; left:12px; top:118%; border:6px solid transparent;
    border-bottom-color:#0f172a; z-index:61;
  }
  .gloss-btn{
    position:fixed; right:24px; bottom:24px; z-index:70;
    background:linear-gradient(135deg,#1e293b,#0f172a); color:#fff; border:none;
    padding:13px 18px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    box-shadow:0 10px 26px -8px rgba(15,23,42,.5); transition:transform .2s, box-shadow .2s;
  }
  .gloss-btn:hover{transform:translateY(-2px); box-shadow:0 14px 30px -8px rgba(15,23,42,.55);}
  .modal{
    position:fixed; inset:0; background:rgba(15,23,42,.5);
    -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:80;
  }
  .modal.open{display:flex;}
  .modal-box{
    background:#fff; border-radius:18px; max-width:680px; width:100%; max-height:80vh; overflow:auto;
    padding:24px 26px; box-shadow:var(--shadow-lg); animation:rise .3s cubic-bezier(.2,.7,.3,1) both;
  }
  .modal-box h3{margin:0 0 14px; font-size:18px; letter-spacing:.5px;}
  .gl-item{border-bottom:1px solid var(--line); padding:11px 2px;}
  .gl-item:last-child{border-bottom:none;}
  .gl-item .gt{font-weight:700; color:#1e3a8a;}
  .gl-item .gd{color:#4b5563; font-size:13px; margin-top:3px;}
  .close{float:right; cursor:pointer; color:var(--muted); font-size:22px; line-height:1; border:none; background:none; transition:color .2s;}
  .close:hover{color:var(--ink);}

  footer{margin-top:36px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; text-align:center; letter-spacing:.2px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    html{scroll-behavior:auto;}
  }
  @media print{
    .toolbar,.gloss-btn,.modal{display:none !important;}
    body{background:#fff;}
    .card,.review-wrap{box-shadow:none; border-color:#d1d5db; animation:none;}
    .wrap{padding:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="boardTitle">市场动态看板</h1>
      <div class="sub">市场每日动态 · 权威官方来源</div>
    </div>
    <span class="proto-badge" id="protoBadge">设计原型 · 示例数据</span>
  </header>

  <div class="toolbar">
    <label for="dateSel">更新日期</label>
    <select id="dateSel"></select>
    <div class="updated">数据更新于：<b id="updatedAt">—</b></div>
    <button id="btnHtml" class="exp-btn">导出 HTML</button>
    <button id="btnPdf" class="exp-btn">导出 PDF</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="review-wrap" id="reviewPanel"></div>

  <footer id="footer"></footer>
</div>

<button class="gloss-btn" id="glossBtn">术语表 / 名词解释</button>

<div class="modal" id="glossModal">
  <div class="modal-box">
    <button class="close" id="glossClose">&times;</button>
    <h3>术语表（点击看板中带下划线的词也可查看）</h3>
    <div id="glossList"></div>
  </div>
</div>

<!--MARKET-DATA-START-->

<script>
  // 读取内嵌数据（自动化将改写 MARKET-DATA 区块）
  function getSeed(){
    try{
      const el = document.getElementById('market-data');
      return JSON.parse(el.textContent);
    }catch(e){ return null; }
  }

  const DATA = getSeed();
  const GLOSSARY = (DATA && DATA.glossary) || {};

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // 名词注释：把文本中的术语替换为带提示的样式（同一页面内仅首次出现才加注释）
  let annotatedCache = new Set();
  function annotate(text){
    const terms = Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
    if(!terms.length) return escapeHtml(text);
    const esc = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const parts = esc.map((t,i)=>{
      const orig = terms[i];
      if(/^[A-Za-z0-9 ./\-()]+$/.test(orig)) return '\\b'+t+'\\b';
      return t;
    });
    const re = new RegExp('('+parts.join('|')+')','gi');
    const termMap = {};
    terms.forEach(t => termMap[t.toLowerCase()] = GLOSSARY[t]);
    const escaped = escapeHtml(text);
    let out='', last=0, m;
    while((m = re.exec(escaped)) !== null){
      const key = m[1];
      const low = key.toLowerCase();
      out += escaped.slice(last, m.index);
      if(annotatedCache.has(low)){
        out += key;                       // 已注释过，本次原样输出
      } else {
        annotatedCache.add(low);
        const tip = termMap[low] || '';
        out += '<span class="term" data-tip="'+escapeAttr(tip)+'">'+key+'</span>';
      }
      last = m.index + key.length;
      if(m.index === re.lastIndex) re.lastIndex++;
    }
    out += escaped.slice(last);
    return out;
  }

  // 收集所有出现过的日期（并集），用于日期选择（不含总结模块）
  function allDates(){
    const set = new Set();
    (DATA.sections||[]).forEach(s=>{
      if(s.type==='review') return;
      Object.keys(s.dates||{}).forEach(d=>set.add(d));
    });
    return Array.from(set).sort().reverse();
  }

  function render(){
    document.getElementById('boardTitle').textContent = DATA.meta.title || '分销市场动态看板';
    document.getElementById('updatedAt').textContent = DATA.meta.updatedAt || '—';
    const proto = document.getElementById('protoBadge');
    if(DATA.meta.isPrototype){ proto.style.display='inline-block'; proto.textContent='设计原型 · 示例数据'; }
    else { proto.style.display='none'; }

    const dates = allDates();
    const sel = document.getElementById('dateSel');
    sel.innerHTML = dates.map(d=>'<option value="'+d+'">'+d+'</option>').join('') || '<option>暂无数据</option>';

    document.getElementById('footer').textContent =
      (DATA.meta.isPrototype ? DATA.meta.prototypeNote + ' · ' : '') +
      '本看板所有动态均可点击“查看来源”跳转至官方权威网站。每日北京时间 24:00 更新（仅收录当日发布的资讯）；周总结每周日 24:00 生成，月总结每月最后一天 24:00 生成；历史保留 30 天。';

    sel.onchange = ()=>renderGrid(sel.value);
    renderGrid(dates[0]);
    annotatedCache = new Set();   // 总结模块独立计"首次出现"
    renderReview();
    renderGlossary();
  }

  function renderGrid(date){
    annotatedCache = new Set();   // 切换日期时重置：本页内术语仅首次出现加注释
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    (DATA.sections||[]).filter(s=>s.type!=='review').forEach(sec=>{
      const entry = (sec.dates||{})[date];
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--accent', sec.accent || '#2563eb');

      let body = '';
      if(!entry){
        body = '<div class="empty">该日期暂无数据。</div>';
      } else {
        body += '<div class="summary"><span class="lbl">每日小结</span>'+annotate(entry.summary||'')+'</div>';
        const items = entry.items || [];

        if(sec.id === 'storage' || sec.id === 'token' || sec.id === 'compute'){
          // 按 国外 / 国内 分组展示，各组无内容时展示对应官方关注渠道
          for(const rg of [['foreign','国外'],['domestic','国内']]){
            const gi = items.filter(i => i.region === rg[0]);
            if(gi.length){
              body += groupHtml(rg[1], gi);
            }else{
              const ch = (sec.channels||[]).filter(c => c.region === rg[0] || !c.region);
              body += '<div class="group-title">'+rg[1]+'</div>' + (ch.length ? channelsHtml(ch) : '<div class="empty">暂无动态</div>');
            }
          }
        } else {
          if(items.length){
            body += itemsHtml(items);
          } else {
            body += channelsHtml(sec.channels);
          }
        }
      }

      card.innerHTML =
        '<div class="card-head"><span class="dot"></span><h2>'+escapeHtml(sec.name)+'</h2>'+
        '<span class="tag">每日动态</span></div>'+
        '<div class="card-body">'+body+'</div>';
      grid.appendChild(card);
    });
  }

  function itemsHtml(items){
    if(!items.length) return '<div class="empty">暂无动态条目。</div>';
    return items.map(it=>{
      const vendor = it.vendor ? '<span class="vendor">'+escapeHtml(it.vendor)+'</span>' : '';
        const excerpt = it.excerpt ? '<p class="iexcerpt">'+annotate(it.excerpt)+'</p>' : '';
      const url = it.url || '';
      const valid = /^https?:\/\//i.test(url);
      const linkHtml = valid
        ? '<a class="link" href="'+escapeAttr(url)+'" target="_blank" rel="noopener">查看来源 ↗</a>'
        : '<span class="link disabled">暂无可用来源链接</span>';
      return '<div class="item">'+
        '<p class="ititle">'+annotate(it.title||'')+'</p>'+
        excerpt+
        '<div class="meta">'+vendor+'<span class="src">'+escapeHtml(it.source||'来源')+'</span>'+
        linkHtml+'</div>'+
        '</div>';
    }).join('');
  }

  function groupHtml(title, items){
    if(!items.length) return '';
    return '<div class="group-title">'+escapeHtml(title)+'</div>'+itemsHtml(items);
  }

  function channelsHtml(channels){
    if(!channels || !channels.length) return '';
    return '<div class="channels"><span class="ch-lbl">官方关注渠道（点击进入官网自行跟进）：</span>' +
      channels.map(c => '<a class="ch-link" href="'+escapeAttr(c.url)+'" target="_blank" rel="noopener">'+escapeHtml(c.name)+' ↗</a>').join('') +
      '</div>';
  }

  // 周/月总结模块
  function renderReview(){
    const sec = (DATA.sections||[]).find(s=>s.type==='review');
    const panel = document.getElementById('reviewPanel');
    if(!sec){ panel.innerHTML=''; return; }
    const w = sec.weekly||{}, m = sec.monthly||{};
    panel.innerHTML =
      '<div class="review-head"><span class="dot" style="background:'+sec.accent+'"></span>'+
      '<h2>'+escapeHtml(sec.name)+'</h2><span class="tag">自动生成</span></div>'+
      '<div class="review-grid">'+
        reviewCard('周总结', w.period, w.summary)+
        reviewCard('月总结', m.period, m.summary)+
      '</div>';
  }
  function reviewCard(title, period, summary){
    return '<div class="review-card"><div class="rc-head">'+title+'</div>'+
      (period?'<div class="rc-period">'+escapeHtml(period)+'</div>':'')+
      '<div class="rc-body">'+(summary?annotate(summary):'<span class="empty">暂无</span>')+'</div></div>';
  }

  function renderGlossary(){
    const list = document.getElementById('glossList');
    list.innerHTML = Object.keys(GLOSSARY).sort((a,b)=>a.length-b.length).map(k=>
      '<div class="gl-item"><div class="gt">'+escapeHtml(k)+'</div><div class="gd">'+escapeHtml(GLOSSARY[k])+'</div></div>'
    ).join('');
  }

  // 术语表弹窗
  document.getElementById('glossBtn').onclick = ()=> document.getElementById('glossModal').classList.add('open');
  document.getElementById('glossClose').onclick = ()=> document.getElementById('glossModal').classList.remove('open');
  document.getElementById('glossModal').onclick = (e)=>{ if(e.target.id==='glossModal') e.target.classList.remove('open'); };

  // 导出功能
  document.getElementById('btnHtml').onclick = exportHTML;
  document.getElementById('btnPdf').onclick = ()=>window.print();
  function exportHTML(){
    const clone = document.querySelector('.wrap').cloneNode(true);
    const tb = clone.querySelector('.toolbar'); if(tb) tb.remove();
    const gb = clone.querySelector('.gloss-btn'); if(gb) gb.remove();
    const css = Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
    const doc = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>'+escapeHtml(DATA.meta.title)+'</title><style>'+css+'</style></head><body>'+clone.outerHTML+'</body></html>';
    const blob = new Blob([doc], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (DATA.meta.title||'市场动态看板')+'_'+(DATA.meta.updatedAt||'')+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }

  render();
</script>
